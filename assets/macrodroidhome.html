<!DOCTYPE html>
<html>
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title>MacroDroid</title>

    <style>
        body {
            font-family: -apple-system, BlinkMacSystemFont, sans-serif;
            background-color: {BG_COLOR}
        }

        a {
            color: {ACCENT_COLOR};
        }

        ul {
            list-style-type: none;
            padding: 0px;
            margin: 0px;
        }

        li {
            padding-bottom: 20px;
        }

        .pin {
            font-size: 30pt;
            border: 0px;
            background-color: {BG_COLOR}
            display: flex;
            justify-content: center;
            align-items: center;
            text-align: center;
        }

        .btn--play {
            background-image: url('/img/macrodroid_icon.png');
        }

        h1 {
            font-size: 26pt;
            color: #FFFFFF;
            width: 100%;
            display: inline-block;
            overflow: hidden;
            text-align: center;
        }

        h2 {
            font-size: 20pt;
            color: #FFFFFF;
            width: 100%;
            display: inline-block;
            overflow: hidden;
            text-align: center;
        }

        h3 {
            font-size: 16pt;
            color: #FFFFFF;
            width: 100%;
            display: inline-block;
            overflow: hidden;
            text-align: center;
        }

        h4 {
            font-size: 14pt;
            color: #FFFF66;
            width: 100%;
            display: inline-block;
            overflow: hidden;
            text-align: center;
        }

        .center {
            display: block;
            margin-left: auto;
            margin-right: auto;
        }

        .continue {
            border-radius: 15px;
            color: #FFFFFF;
            font-size: 15pt;
            border: 0px;
            width: 100%;
            background-color: {ACCENT_COLOR};
            padding: 10px;
            justify-content: center;
            align-items: center;
            text-align: center;
        }

        #form_login {
            display: flex;
            justify-content: center;
            align-items: center;
        }

        #page loader {
            position: absolute;
            top: 0;
            bottom: 0;
            left: 0;
            right: 0;
            z-index: 10000;
            display: none;
            text-align: center;
            width: 100%;
            padding-top: 25px;
            background-color: rgba(255, 255, 255, 0.7);
        }

    </style>
</head>

    <body>
        <img src="/img/macrodroid_icon.png" alt="MacroDroid icon" width="96" height="96" class="center">
        <h2>{device_name}</h2>

        {SYSTEM_LOG_LINK}

        {USER_LOG_LINKS}

        <h4>{MACRO_LINKS_TITLE}</h4>

        {MACRO_LINKS}

    </body>
</html>
